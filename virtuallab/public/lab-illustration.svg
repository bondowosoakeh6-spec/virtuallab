<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- Lab bench / table -->
  <rect x="30" y="220" width="440" height="8" rx="2" fill="#CBD5E1"/>
  <rect x="30" y="228" width="440" height="4" fill="#94A3B8"/>
  
  <!-- Microscope -->
  <g transform="translate(200, 60)">
    <!-- Base -->
    <ellipse cx="40" cy="155" rx="35" ry="8" fill="#1E3A5F"/>
    <!-- Pillar -->
    <rect x="35" y="30" width="10" height="125" rx="3" fill="#2D4A6F"/>
    <!-- Arm -->
    <path d="M35 40 L80 30 L80 60 L35 60 Z" fill="#2D4A6F"/>
    <!-- Eyepiece -->
    <rect x="30" y="15" width="20" height="25" rx="4" fill="#1E3A5F"/>
    <rect x="33" y="10" width="14" height="8" rx="3" fill="#364F6B"/>
    <!-- Objective -->
    <rect x="70" y="55" width="8" height="20" rx="2" fill="#1E3A5F"/>
    <!-- Stage -->
    <rect x="50" y="80" width="40" height="5" rx="1" fill="#364F6B"/>
    <!-- Focus knob -->
    <circle cx="35" cy="90" r="8" fill="#364F6B"/>
    <circle cx="35" cy="90" r="5" fill="#2D4A6F"/>
    <!-- Lens circles -->
    <circle cx="40" cy="10" r="5" fill="#4A90D9" opacity="0.5"/>
  </g>
  
  <!-- Erlenmeyer Flask (left) -->
  <g transform="translate(80, 100)">
    <path d="M25 0 L25 60 L5 115 L45 115 L25 60 Z" fill="#D1E8FF" opacity="0.7" stroke="#4A90D9" stroke-width="1.5"/>
    <path d="M5 115 L45 115 L42 105 L8 105 Z" fill="#4A90D9" opacity="0.4"/>
    <rect x="18" y="0" width="14" height="5" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Beaker with liquid -->
  <g transform="translate(340, 90)">
    <rect x="0" y="10" width="50" height="70" rx="3" fill="#E1F0FF" opacity="0.6" stroke="#4A90D9" stroke-width="1.5"/>
    <rect x="3" y="45" width="44" height="32" rx="2" fill="#4A90D9" opacity="0.3"/>
    <!-- Measurement lines -->
    <line x1="5" y1="30" x2="15" y2="30" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="5" y1="45" x2="15" y2="45" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="5" y1="60" x2="15" y2="60" stroke="#94A3B8" stroke-width="0.8"/>
    <!-- Spout -->
    <path d="M0 10 L-5 5 L0 10" stroke="#4A90D9" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Test tubes in rack -->
  <g transform="translate(400, 80)">
    <!-- Rack -->
    <rect x="-5" y="60" width="70" height="8" rx="2" fill="#364F6B"/>
    <rect x="0" y="30" width="3" height="38" fill="#364F6B"/>
    <rect x="57" y="30" width="3" height="38" fill="#364F6B"/>
    <!-- Tubes -->
    <rect x="8" y="10" width="8" height="55" rx="4" fill="#FFE0E0" opacity="0.7" stroke="#E88" stroke-width="1"/>
    <rect x="20" y="5" width="8" height="60" rx="4" fill="#E0FFE0" opacity="0.7" stroke="#8C8" stroke-width="1"/>
    <rect x="32" y="12" width="8" height="53" rx="4" fill="#E0E0FF" opacity="0.7" stroke="#88E" stroke-width="1"/>
    <rect x="44" y="8" width="8" height="57" rx="4" fill="#FFFFE0" opacity="0.7" stroke="#CC8" stroke-width="1"/>
  </g>
  
  <!-- Volumetric flask -->
  <g transform="translate(140, 80)">
    <path d="M20 0 L20 40 L5 100 Q0 115 15 120 L25 120 Q40 115 35 100 L20 40 Z" fill="#E8F4FD" opacity="0.6" stroke="#4A90D9" stroke-width="1.5"/>
    <path d="M5 100 Q0 115 15 120 L25 120 Q40 115 35 100 Z" fill="#4A90D9" opacity="0.25"/>
    <rect x="14" y="0" width="12" height="6" rx="2" fill="#94A3B8"/>
    <line x1="8" y1="85" x2="32" y2="85" stroke="#4A90D9" stroke-width="0.8" stroke-dasharray="3,2"/>
  </g>

  <!-- Petri dish -->
  <g transform="translate(310, 185)">
    <ellipse cx="25" cy="15" rx="30" ry="10" fill="#E8F4FD" opacity="0.6" stroke="#4A90D9" stroke-width="1"/>
    <ellipse cx="25" cy="18" rx="30" ry="10" fill="none" stroke="#4A90D9" stroke-width="1"/>
    <ellipse cx="25" cy="15" rx="22" ry="7" fill="#4A90D9" opacity="0.15"/>
  </g>

  <!-- Magnifying glass accent -->
  <g transform="translate(50, 170)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#2D4A6F" stroke-width="2.5"/>
    <line x1="24" y1="24" x2="35" y2="35" stroke="#2D4A6F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="15" cy="15" r="8" fill="#4A90D9" opacity="0.1"/>
  </g>

  <!-- Dropper / Pipette -->
  <g transform="translate(160, 60)">
    <rect x="0" y="20" width="6" height="50" rx="1" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
    <path d="M0 20 Q3 10 6 20" fill="#364F6B"/>
    <circle cx="3" cy="72" r="2" fill="#4A90D9" opacity="0.6"/>
  </g>
</svg>
